<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
</head>
<body>
    <h1>Student Admission Form</h1>
    <form method="post">
        <!--Name-->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>
        <!--Mobile Number-->
        <label for="phone">Mobile Number:</label>
        <input type="tel" id="phone" name="phone" required><br>
        <!--Date of Birth-->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br>
        <!--Gender-->
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <!--Hobbies-->
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="reading" name="hobbies" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" id="swimming" name="hobbies" value="swimming">
        <label for="swimming">Swimming</label>
        <input type="checkbox" id="exploring" name="hobbies" value="exploring">
        <label for="exploring">Exploring new places</label><br>
        <!--Course Selection-->
        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="mern stack development">MERN Stack Development</option>
            <option value="data-science">Data Science</option>
            <option value="java development">Java Development</option>
        </select>
        <!--Address-->
        <label for="address">Address:</label> 
        <textarea id="address" name="address" rows="4" cols="50" required></textarea><br>
        <!--Profile Picture-->
        <label for="profile picture">Profile Picture:</label>
        <input type="file" id="profile picture" name="profile picture" accept="image/*" required><br>
        <!--Skills Level-->
        <label for="skills level">Skills Level:</label>
        <input type="range" id="skills level" name="skills level" min="0" max="100" required><br>
        <!--Submit and Reset Buttons-->
        <input type="submit" value="Submit">
        <button type="submit">Submit</button>
        <input type="reset" value="Reset">
        <button type="reset">Reset</button>
    </form>
</body>
</html>
